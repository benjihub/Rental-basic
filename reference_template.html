<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Room Rental Management System web application starter template"><title>Room Rental Management System</title><style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#182230;--muted:#64748b;--line:#e6eaf1;--primary:#2457c5;--primary-dark:#1c4295;--soft:#edf3ff;--green:#16835f;--green-bg:#e8f7f0;--amber:#a85c00;--amber-bg:#fff4df;--red:#b42318;--red-bg:#fff0ee;--purple:#6741a5;--shadow:0 8px 30px rgba(15,23,42,.05)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9d0ff;outline-offset:1px}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:#101b31;color:#e8eef9;display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 25px;border-bottom:1px solid rgba(255,255,255,.12)}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:grid;place-items:center;font-size:20px;font-weight:800;color:white}.brand-name{font-size:15px;font-weight:750;letter-spacing:.1px}.brand-sub{font-size:11px;color:#a7b4ca;margin-top:2px}.nav-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#91a0b9;margin:24px 10px 9px}.nav{display:grid;gap:4px}.nav button{border:0;color:#c4cee0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button .ico{width:19px;text-align:center;font-size:16px}.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button.active{background:#284574;color:#fff;box-shadow:inset 3px 0 #6fa1ff}.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:16px 7px 0;color:#a7b4ca;font-size:11px}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:18px}.crumb{font-size:12px;color:var(--muted)}.userbox{display:flex;align-items:center;gap:11px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8efff;color:#244e9b;font-weight:800}.user-name{font-weight:700;font-size:13px}.user-role{font-size:11px;color:var(--muted)}.content{padding:28px 30px 36px;max-width:1550px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:23px}.page-head h1{margin:0;font-size:26px;letter-spacing:-.6px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:#344256;border-radius:9px;padding:9px 13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#f7f9fc}.btn-primary{background:var(--primary);border-color:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}.btn-danger{color:var(--red);border-color:#ffd0ca}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:17px}.stat-value{font-size:25px;letter-spacing:-.6px;font-weight:800;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}.layout-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.8fr);gap:17px}.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);min-width:0;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:15px;margin:0}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.panel-body{padding:18px 20px}.table-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{min-width:210px;max-width:360px;width:100%;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.filter{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;color:#344256}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#778398;background:#fbfcfe;padding:12px 18px;border-bottom:1px solid var(--line)}td{padding:13px 18px;border-bottom:1px solid #eef1f6;font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}.primary-cell{font-weight:750;color:#243349}.secondary-cell{color:var(--muted);font-size:11px;margin-top:3px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:750}.badge:before{content:"";height:5px;width:5px;border-radius:50%;background:currentColor}.badge.green{background:var(--green-bg);color:var(--green)}.badge.amber{background:var(--amber-bg);color:var(--amber)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.blue{background:#edf3ff;color:#2858b4}.badge.gray{background:#f0f2f6;color:#667085}.mini-list{display:grid;gap:0}.mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef1f6}.mini-row:last-child{border-bottom:0}.mini-main{min-width:0}.mini-title{font-weight:700;font-size:12px}.mini-sub{color:var(--muted);font-size:11px;margin-top:3px}.mini-value{font-weight:750;white-space:nowrap}.room-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.room-tile{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.room-tile .room-number{font-size:15px;font-weight:800}.room-tile .room-type{font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:12px}.room-tile .room-foot{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap}.progress{height:7px;border-radius:10px;background:#edf0f6;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;border-radius:10px;background:var(--primary)}.empty{padding:36px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:13px;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f0f3f8;border-radius:8px;width:32px;height:32px;font-size:18px}.modal-body{padding:21px 22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#465369}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ec;border-radius:9px;padding:10px 11px;min-width:0;background:#fff;color:var(--text)}.field textarea{min-height:75px;resize:vertical}.hint{font-size:10px;color:var(--muted)}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.notice{display:flex;gap:11px;padding:13px 14px;background:#f6f8fc;border:1px solid var(--line);border-radius:11px;color:#4b5a70;font-size:12px}.notice strong{color:var(--text)}.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.report-number{font-size:24px;font-weight:800;margin:7px 0}.bar-chart{height:150px;display:flex;align-items:flex-end;gap:12px;padding:15px 4px 2px}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;height:100%}.bar{width:min(30px,85%);min-height:4px;background:#4f7ed8;border-radius:6px 6px 2px 2px}.bar-label{font-size:10px;color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#14213a;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;display:none;font-size:12px}.toast.show{display:block}.mobile-menu{display:none;border:0;background:#eff3fa;border-radius:8px;padding:8px}.footnote{color:var(--muted);font-size:11px;margin-top:18px}.inline-value{font-weight:800}.money{font-variant-numeric:tabular-nums}
@media(max-width:1120px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.room-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.content{padding:24px 20px}.topbar{padding:0 20px}}
@media(max-width:800px){.sidebar{width:220px}.layout-2{grid-template-columns:1fr}.room-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page-head{flex-direction:column}.actions{width:100%}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;z-index:15;top:0;bottom:0;left:-255px;width:245px;transition:left .2s}.sidebar.open{left:0;box-shadow:12px 0 40px #0b122333}.mobile-menu{display:block}.topbar{height:65px;padding:0 15px}.content{padding:20px 13px}.user-name{font-size:12px}.user-role{display:none}.cards{gap:10px}.stat{padding:13px}.stat-value{font-size:21px}.stat-top{font-size:11px}.stat-icon{width:29px;height:29px}.room-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table-tools{padding:12px}.search{max-width:none}.report-grid{grid-template-columns:1fr}.page-head h1{font-size:23px}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">R</div><div><div class="brand-name">Room Rental</div><div class="brand-sub">PROPERTY MANAGEMENT</div></div></div><div class="nav-label">Workspace</div><nav class="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span><span>Dashboard</span></button><button class="" data-page="rooms"><span class="ico">⌂</span><span>Rooms</span></button><button class="" data-page="clients"><span class="ico">♙</span><span>Clients</span></button><button class="" data-page="bookings"><span class="ico">▣</span><span>Bookings</span></button><button class="" data-page="payments"><span class="ico">↗</span><span>Payments</span></button><button class="" data-page="reports"><span class="ico">▤</span><span>Reports</span></button></nav><div class="side-bottom">Starter template · Demo data is stored in this browser</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button><div><div class="crumb">Workspace / <span id="crumb">Dashboard</span></div><div style="font-size:12px;font-weight:800;margin-top:3px">Room Rental</div></div></div><div class="userbox"><div class="avatar">R</div><div><div class="user-name">Administrator</div><div class="user-role">Demo workspace</div></div></div></header><div class="content" id="content"></div></main></div><div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="close" id="modalClose" aria-label="Close dialog">×</button></div><div class="modal-body" id="modalBody"></div></section></div><div class="toast" id="toast" role="status"></div><script>const KEY='rentalManagementDemo_v1';
const initial={rooms:[
{id:'R-001',name:'Room 01',type:'Single',rent:180000,status:'Occupied',floor:'Ground floor'},
{id:'R-002',name:'Room 02',type:'Double',rent:250000,status:'Available',floor:'Ground floor'},
{id:'R-003',name:'Room 03',type:'Single',rent:180000,status:'Reserved',floor:'First floor'},
{id:'R-004',name:'Room 04',type:'Self-contained',rent:350000,status:'Occupied',floor:'First floor'},
{id:'R-005',name:'Room 05',type:'Double',rent:250000,status:'Available',floor:'First floor'},
{id:'R-006',name:'Room 06',type:'Single',rent:180000,status:'Maintenance',floor:'Second floor'}],
clients:[{id:'C-001',name:'Asha M.',phone:'+255 7XX XXX XXX',email:'',idNumber:'',created:'2026-10-02'},{id:'C-002',name:'Daniel K.',phone:'+255 6XX XXX XXX',email:'',idNumber:'',created:'2026-10-05'},{id:'C-003',name:'Neema J.',phone:'+255 7XX XXX XXX',email:'',idNumber:'',created:'2026-10-10'}],
bookings:[{id:'B-001',roomId:'R-001',clientId:'C-001',checkIn:'2026-10-01',checkOut:'2026-11-01',rent:180000,status:'Checked in'},{id:'B-002',roomId:'R-004',clientId:'C-002',checkIn:'2026-10-04',checkOut:'2026-11-04',rent:350000,status:'Checked in'},{id:'B-003',roomId:'R-003',clientId:'C-003',checkIn:'2026-10-20',checkOut:'2026-11-20',rent:180000,status:'Reserved'}],
payments:[{id:'P-001',date:'2026-10-02',clientId:'C-001',roomId:'R-001',amount:180000,method:'Mobile money',note:'October rent'},{id:'P-002',date:'2026-10-04',clientId:'C-002',roomId:'R-004',amount:200000,method:'Cash',note:'Part payment'}]};
let db=load(), page='dashboard';function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return JSON.parse(JSON.stringify(initial))}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(prefix,arr){return prefix+'-'+String(Math.max(0,...arr.map(x=>parseInt((x.id||'').split('-').at(-1))||0))+1).padStart(3,'0')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return 'TZS '+Number(n||0).toLocaleString('en-US')}function today(){return new Date().toISOString().slice(0,10)}function roomName(x){return db.rooms.find(r=>r.id===x)?.name||x||'—'}function clientName(x){return db.clients.find(c=>c.id===x)?.name||x||'—'}function badge(s){let cl={'Available':'green','Occupied':'red','Reserved':'amber','Maintenance':'gray','Checked in':'red','Upcoming':'blue','Completed':'gray','Cancelled':'gray','Paid':'green','Part-paid':'amber','Overdue':'red'}[s]||'gray';return `<span class="badge ${cl}">${esc(s)}</span>`}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}function money(v){return Number(v||0)}
function header(title,desc,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function stat(label,val,icon,note=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${val}</div><div class="stat-note">${note}</div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=({dashboard:'Dashboard',rooms:'Rooms',clients:'Clients',bookings:'Bookings',payments:'Payments',reports:'Reports'})[page]||'Dashboard';let c=document.getElementById('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='rooms')c.innerHTML=roomsPage();if(page==='clients')c.innerHTML=clientsPage();if(page==='bookings')c.innerHTML=bookingsPage();if(page==='payments')c.innerHTML=paymentsPage();if(page==='reports')c.innerHTML=reportsPage();wireSearch()}
function dashboard(){let occ=db.rooms.filter(r=>r.status==='Occupied').length, avail=db.rooms.filter(r=>r.status==='Available').length, reserved=db.rooms.filter(r=>r.status==='Reserved').length, paid=db.payments.filter(p=>p.date.startsWith(today().slice(0,7))).reduce((s,p)=>s+money(p.amount),0);let recent=[...db.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${header('Rental dashboard','A live overview of room availability, clients, and rental collections.',`<button class="btn" onclick="go('reports')">▤ View reports</button><button class="btn btn-primary" onclick="openForm('booking')">＋ New booking</button>`)}<div class="cards">${stat('Total rooms',db.rooms.length,'▦','All registered rooms')}${stat('Occupied rooms',occ,'⌂',`${db.rooms.length?Math.round(occ/db.rooms.length*100):0}% occupancy`) }${stat('Available rooms',avail,'♧',`${reserved} rooms reserved`)}${stat('Payments this month',fmt(paid),'↗','Recorded rental collections')}</div><div class="layout-2"><section class="panel"><div class="panel-head"><div><h2>Room status</h2><p>Availability across the property</p></div><button class="btn" onclick="go('rooms')">Manage rooms →</button></div><div class="panel-body"><div class="room-grid">${db.rooms.slice(0,8).map(r=>`<div class="room-tile"><div class="room-number">${esc(r.name)}</div><div class="room-type">${esc(r.type)} · ${fmt(r.rent)}/month</div><div class="room-foot">${badge(r.status)}<button class="btn" style="padding:4px 7px" onclick="editRoomStatus('${r.id}')">Edit</button></div></div>`).join('')||'<div class="empty">No rooms added yet.</div>'}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Recent payments</h2><p>Latest rental transactions</p></div><button class="btn" onclick="go('payments')">All payments →</button></div><div class="panel-body"><div class="mini-list">${recent.map(p=>`<div class="mini-row"><div class="mini-main"><div class="mini-title">${esc(clientName(p.clientId))}</div><div class="mini-sub">${esc(roomName(p.roomId))} · ${esc(p.date)}</div></div><div class="mini-value money">${fmt(p.amount)}</div></div>`).join('')||'<div class="empty">No payments recorded.</div>'}</div></div></section></div><div class="notice" style="margin-top:17px"><span>ⓘ</span><div><strong>Template preview:</strong> Demo records are provided. Add your actual rooms, clients, bookings, and payments. This version saves data only in this browser; it is not yet connected to a shared online database.</div></div>`}
function roomsPage(){return `${header('Rooms','Register your rooms and keep their rental price and current status up to date.',`<button class="btn btn-primary" onclick="openForm('room')">＋ Add room</button>`)}<section class="panel"><div class="table-tools"><div class="search"><input id="tableSearch" placeholder="Search room number or type…" /></div><select class="filter" id="statusFilter"><option value="">All statuses</option><option>Available</option><option>Occupied</option><option>Reserved</option><option>Maintenance</option></select></div><div class="table-wrap"><table><thead><tr><th>Room</th><th>Type / floor</th><th>Monthly rent</th><th>Status</th><th>Current client</th><th>Action</th></tr></thead><tbody>${db.rooms.map(r=>{let b=db.bookings.find(b=>b.roomId===r.id&&b.status==='Checked in');return `<tr data-search="${esc((r.name+' '+r.type+' '+r.status+' '+r.floor+' '+clientName(b?.clientId)).toLowerCase())}" data-status="${esc(r.status)}"><td><div class="primary-cell">${esc(r.name)}</div><div class="secondary-cell">${esc(r.id)}</div></td><td>${esc(r.type)}<div class="secondary-cell">${esc(r.floor||'—')}</div></td><td class="money">${fmt(r.rent)}</td><td>${badge(r.status)}</td><td>${b?esc(clientName(b.clientId)):'—'}</td><td><button class="btn" onclick="editRoomStatus('${r.id}')">Edit status</button></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">No rooms registered. Select Add room to begin.</div></td></tr>'}</tbody></table></div></section>`}
function clientsPage(){return `${header('Clients','Maintain client contact details and look up their rental history.',`<button class="btn btn-primary" onclick="openForm('client')">＋ Add client</button>`)}<section class="panel"><div class="table-tools"><div class="search"><input id="tableSearch" placeholder="Search client name, phone, or ID…" /></div></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Phone</th><th>Email</th><th>ID / reference</th><th>Active room</th><th>Registered</th></tr></thead><tbody>${db.clients.map(c=>{let b=db.bookings.find(b=>b.clientId===c.id&&b.status==='Checked in');return `<tr data-search="${esc((c.name+' '+c.phone+' '+c.email+' '+c.idNumber).toLowerCase())}"><td><div class="primary-cell">${esc(c.name)}</div><div class="secondary-cell">${esc(c.id)}</div></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.idNumber||'—')}</td><td>${b?esc(roomName(b.roomId)):'—'}</td><td>${esc(c.created||'—')}</td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">No client records yet.</div></td></tr>'}</tbody></table></div></section>`}
function bookingsPage(){return `${header('Bookings','Track upcoming reservations, check-ins, and completed stays.',`<button class="btn btn-primary" onclick="openForm('booking')">＋ New booking</button>`)}<section class="panel"><div class="table-tools"><div class="search"><input id="tableSearch" placeholder="Search booking, room, or client…" /></div><select class="filter" id="statusFilter"><option value="">All booking statuses</option><option>Reserved</option><option>Checked in</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table><thead><tr><th>Booking ID</th><th>Client</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Rate / month</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.bookings.map(b=>`<tr data-search="${esc((b.id+' '+clientName(b.clientId)+' '+roomName(b.roomId)).toLowerCase())}" data-status="${esc(b.status)}"><td class="primary-cell">${esc(b.id)}</td><td>${esc(clientName(b.clientId))}</td><td>${esc(roomName(b.roomId))}</td><td>${esc(b.checkIn)}</td><td>${esc(b.checkOut)}</td><td class="money">${fmt(b.rent)}</td><td>${badge(b.status)}</td><td><button class="btn" onclick="bookingAction('${b.id}')">Update</button></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">No bookings yet.</div></td></tr>'}</tbody></table></div></section>`}
function paymentsPage(){return `${header('Payments','Record rent payments and review amounts collected.',`<button class="btn btn-primary" onclick="openForm('payment')">＋ Record payment</button>`)}<section class="panel"><div class="table-tools"><div class="search"><input id="tableSearch" placeholder="Search payment, client, or room…" /></div></div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Client</th><th>Room</th><th>Payment method</th><th>Note</th><th>Amount</th></tr></thead><tbody>${[...db.payments].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr data-search="${esc((p.id+' '+clientName(p.clientId)+' '+roomName(p.roomId)+' '+p.method+' '+p.note).toLowerCase())}"><td class="primary-cell">${esc(p.id)}</td><td>${esc(p.date)}</td><td>${esc(clientName(p.clientId))}</td><td>${esc(roomName(p.roomId))}</td><td>${esc(p.method)}</td><td>${esc(p.note||'—')}</td><td class="money inline-value">${fmt(p.amount)}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No payments yet.</div></td></tr>'}</tbody></table></div><div class="panel-head"><strong>Total recorded payments</strong><strong>${fmt(db.payments.reduce((s,p)=>s+money(p.amount),0))}</strong></div></section>`}
function reportsPage(){let total=db.payments.reduce((s,p)=>s+money(p.amount),0),monthly=db.payments.filter(p=>p.date.startsWith(today().slice(0,7))).reduce((s,p)=>s+money(p.amount),0), occ=db.rooms.filter(r=>r.status==='Occupied').length;return `${header('Reports & summary','A quick summary for property oversight and reconciliation.',`<button class="btn" onclick="window.print()">⤓ Print report</button>`)}<div class="report-grid"><section class="panel"><div class="panel-head"><h2>Occupancy summary</h2></div><div class="panel-body">${stat('Occupancy rate',`${db.rooms.length?Math.round(occ/db.rooms.length*100):0}%`,'⌂',`${occ} occupied out of ${db.rooms.length} rooms`)}<div class="mini-list" style="margin-top:12px"><div class="mini-row"><span>Available</span>${badge('Available')}<strong>${db.rooms.filter(r=>r.status==='Available').length}</strong></div><div class="mini-row"><span>Reserved</span>${badge('Reserved')}<strong>${db.rooms.filter(r=>r.status==='Reserved').length}</strong></div><div class="mini-row"><span>Maintenance</span>${badge('Maintenance')}<strong>${db.rooms.filter(r=>r.status==='Maintenance').length}</strong></div></div></div></section><section class="panel"><div class="panel-head"><h2>Rental collections</h2></div><div class="panel-body">${stat('All recorded payments',fmt(total),'↗','Across all dates')}<div style="margin-top:14px;color:var(--muted);font-size:12px">Collections this month</div><div class="report-number money">${fmt(monthly)}</div><div class="secondary-cell">Based on payment dates recorded in this browser.</div></div></section></div><p class="footnote">This preview is not a substitute for formal accounting. Reconcile records with the actual cash, bank, or mobile-money statements.</p>`}
function wireSearch(){let s=document.getElementById('tableSearch'),f=document.getElementById('statusFilter');function run(){let q=(s?.value||'').toLowerCase(),st=f?.value||'';document.querySelectorAll('tbody tr[data-search]').forEach(r=>{r.style.display=(r.dataset.search.includes(q)&&(!st||r.dataset.status===st))?'':'none'})}s?.addEventListener('input',run);f?.addEventListener('change',run)}
function formField(label,name,type='text',value='',opts=null,required=true,full=false){let html=type==='select'?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''}/>`;return `<div class="field ${full?'full':''}"><label>${label}</label>${html}</div>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('open');document.getElementById('sidebar').classList.remove('open')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}function openForm(type){let form='';if(type==='room'){form=`<form id="dataForm"><div class="form-grid">${formField('Room name / number','name')}${formField('Room type','type','select','Single',['Single','Double','Self-contained','Family','Dormitory'].map(x=>({value:x,label:x})))}${formField('Monthly rent (TZS)','rent','number')}${formField('Floor / location','floor','text','',null,false)}${formField('Status','status','select','Available',['Available','Occupied','Reserved','Maintenance'].map(x=>({value:x,label:x})))}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save room</button></div></form>`;openModal('Add room',form);document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.rooms.push({id:id('R',db.rooms),...d,rent:+d.rent});save();closeModal();render();showToast('Room saved')}}
if(type==='client'){form=`<form id="dataForm"><div class="form-grid">${formField('Full name','name')}${formField('Phone number','phone')}${formField('Email (optional)','email','email','',null,false)}${formField('ID / reference number (optional)','idNumber','text','',null,false)}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save client</button></div></form>`;openModal('Register client',form);document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.clients.push({id:id('C',db.clients),...d,created:today()});save();closeModal();render();showToast('Client registered')}}
if(type==='booking'){if(!db.rooms.length||!db.clients.length){showToast('Add at least one room and one client first');return}let free=db.rooms.filter(r=>r.status==='Available'||r.status==='Reserved');if(!free.length){showToast('No available room in the room register');return}form=`<form id="dataForm"><div class="form-grid">${formField('Client','clientId','select','',db.clients.map(c=>({value:c.id,label:c.name+' · '+c.phone})))}${formField('Room','roomId','select','',free.map(r=>({value:r.id,label:r.name+' · '+fmt(r.rent)})))}${formField('Check-in date','checkIn','date',today())}${formField('Expected check-out','checkOut','date',today())}${formField('Monthly rent (TZS)','rent','number',free[0].rent)}${formField('Booking status','status','select','Reserved',['Reserved','Checked in'].map(x=>({value:x,label:x})))}</div><div class="hint">Check dates and room availability before saving. This starter does not automatically resolve overlapping date ranges.</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save booking</button></div></form>`;openModal('Create booking',form);document.querySelector('[name=roomId]').onchange=e=>{document.querySelector('[name=rent]').value=db.rooms.find(r=>r.id===e.target.value)?.rent||0};document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.checkOut<=d.checkIn){showToast('Check-out must be after check-in');return}if(d.status==='Checked in'&&db.bookings.some(b=>b.roomId===d.roomId&&b.status==='Checked in')){showToast('This room already has a checked-in booking');return}db.bookings.push({id:id('B',db.bookings),...d,rent:+d.rent});let rm=db.rooms.find(r=>r.id===d.roomId);if(rm)rm.status=d.status==='Checked in'?'Occupied':'Reserved';save();closeModal();render();showToast('Booking saved')}}
if(type==='payment'){if(!db.clients.length||!db.rooms.length){showToast('Add clients and rooms first');return}form=`<form id="dataForm"><div class="form-grid">${formField('Payment date','date','date',today())}${formField('Client','clientId','select','',db.clients.map(c=>({value:c.id,label:c.name})))}${formField('Room','roomId','select','',db.rooms.map(r=>({value:r.id,label:r.name})))}${formField('Amount received (TZS)','amount','number')}${formField('Payment method','method','select','Mobile money',['Cash','Mobile money','Bank transfer','Card','Other'].map(x=>({value:x,label:x})))}${formField('Note / period','note','text','',null,false,true)}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save payment</button></div></form>`;openModal('Record rental payment',form);document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.payments.push({id:id('P',db.payments),...d,amount:+d.amount});save();closeModal();render();showToast('Payment recorded')}}}
function editRoomStatus(rid){let r=db.rooms.find(x=>x.id===rid);if(!r)return;let opts=['Available','Occupied','Reserved','Maintenance'].map(x=>({value:x,label:x}));openModal('Update '+r.name,`<form id="dataForm"><div class="form-grid">${formField('Room status','status','select',r.status,opts)}<div class="field full"><div class="hint">If a room is occupied, make sure an active booking exists for the client.</div></div></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Update status</button></div></form>`);document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();r.status=new FormData(e.target).get('status');save();closeModal();render();showToast('Room status updated')}}
function bookingAction(bid){let b=db.bookings.find(x=>x.id===bid);if(!b)return;openModal('Update '+b.id,`<form id="dataForm"><div class="form-grid">${formField('Booking status','status','select',b.status,['Reserved','Checked in','Completed','Cancelled'].map(x=>({value:x,label:x})))}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save status</button></div></form>`);document.getElementById('dataForm').onsubmit=e=>{e.preventDefault();b.status=new FormData(e.target).get('status');let r=db.rooms.find(r=>r.id===b.roomId);if(r){if(b.status==='Checked in')r.status='Occupied';else if(b.status==='Reserved')r.status='Reserved';else if(['Completed','Cancelled'].includes(b.status))r.status='Available'}save();closeModal();render();showToast('Booking updated')}}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();</script></body></html>
